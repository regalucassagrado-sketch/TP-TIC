<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
   
    <style>

* {
    box-sizing: border-box;  
    margin: 0;
    padding: 0;
}


body {
    font-family: Georgia, 'Times New Roman', Times, serif;
    background: linear-gradient(to right, #728ca7, #374f6e);
    min-height: 100vh;         
    display: flex;             
    justify-content: center;   
    align-items: center;       
    padding: 60px;    
    color: rgb(218, 6, 6);         
    
    
}

body > div {
    background: #ffffff;   
    box-shadow: 0 10px 10px rgba(0, 0, 0, 0.1);  
    border-radius: 30px;                
    padding: 50px;                     
    width: 200%;                         
    max-width: 700px;                    
}

h1 {
    font-size: 50px;       
    font-weight: 1000;     
    color: #222335;        
    margin-bottom: 2rem;   
    text-align: center;    
}

h1 + p {
    font-weight: 1000;  
    text-align: center;
    color: #4454e2;          
    margin-bottom: 2rem;      
}

h1 + p + p {
    font-weight: 1000;  
    text-align: center;
    color: #fd0000;          
    margin-bottom: 2rem;   
}

form {
    display: flex;
    flex-direction: column;   
    gap: 2rem;              
}

fieldset {
    border:  solid #9db1d6;          
    border-radius: 20px;              
    padding: 1rem;                    
}

fieldset:hover {
    border-color: #50588d;   /* preguntar a mia esto */
}

legend {
    font-weight: 1000;   
    font-size: 30px;        
    color: #2b305f;          
    padding: 1rem;       
    display: flex;
    align-items: center;                   
}

fieldset > div {
    margin-bottom: 2rem;    
}

label {
    display: block;          
    font-weight: 1000;       
    font-size: 15px;
    color: #47435a;          /* preguntar a mia*/
    margin-bottom: 0.5rem;   
    cursor: pointer;         
}

input[type="text"],
input[type="email"],
input[type="tel"],
input[type="date"],
input[type="password"],
select,
textarea {
    width: 50%;                       
    padding: 0.4rem 0.5rem;           
    border: solid #cbd5e1;         /* preguntar a mia */
    border-radius: 12px;              
    font-family: Georgia, 'Times New Roman', Times, serif;             
    background: #ffffff;               /* preguntar a mia */
    
}

input[type="text"]:focus,
input[type="email"]:focus,
input[type="tel"]:focus,
input[type="date"]:focus,
input[type="password"]:focus,
select:focus,
textarea:focus {
    border-color: #665eff;                      
    background: rgb(223, 223, 223);                            /* preguntar las dos cosas */
}

input::placeholder,
textarea::placeholder {
    color: #6b85aa60;      /* preguntar esto*/
    font-style: Georgia, 'Times New Roman', Times, serif;  /* preguntar esto */
}

select {
    appearance: none;
    padding-right: 0.5rem;                   
    cursor: pointer;
    font-style: Georgia, 'Times New Roman', Times, serif;
}

input[type="radio"],
input[type="checkbox"] {
    appearance: none;              
    width: 20px;
    height: 20px;
    border: 1px solid #83a7ac;     /* preguntar mia */         
    vertical-align: middle;        
    cursor: pointer;               
}


input[type="radio"] {
    border-radius: 70%;           
}

input[type="checkbox"] {
    border-radius: 7px;
}


input[type="radio"]:checked {
    box-shadow: inset 0 0 0 4px #00ffaa;  /* preguntar a mia */
}

input[type="checkbox"]:checked {
    border-color: #4f46e5; /* preguntar a mia */
    background: #4f46e5;
}

input[type="radio"]:hover,
input[type="checkbox"]:hover {
    border-color: #4f46e5;   /* preguntar a mia */
}


fieldset > div > div {
    display: flex;
    flex-wrap: wrap;              
    gap: 1rem 2rem;           
}


fieldset > div > div label {
    display: inline-flex;         
    align-items: center;          
    cursor: pointer;
    padding: 0.4rem 0.75rem;      
    border-radius: 30px;         
    background: #f1f5f9;          /* preguntar a mia */

}


fieldset > div > div label:has(input:checked) {
    border-color: #4f46e5;         /* preguntar a mia */
    color: #4f46e5;                
}



button {
    font-family: Georgia, 'Times New Roman', Times, serif;      
    font-weight: 1000;            
    padding: 0.4rem 2rem;        
    border: none;
    border-radius: 20px;           
    cursor: pointer;               
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

button[type="submit"] {
    background: #01000f;           
    color: red;                  /* preguntar a mia */
}

button[type="submit"]:hover {
    background: #ff0000;                              /* preguntar a mia */
    transform: translateY(-4px);                      
}

button[type="submit"]:active {
    transform: translateY(0);                          
}


button[type="reset"] {
    color: #64748b;               
}


button[type="reset"]:hover {
    color: #1e293b;                
    transform: translateY(-4px);   
}


button[type="reset"]:active {
    transform: translateY(0);      
}


input:valid:not(:placeholder-shown):not([type="radio"]):not([type="checkbox"]) {
    border-color: #0077ff;         
}


input:invalid:not(:placeholder-shown):not(:focus):not([type="radio"]):not([type="checkbox"]) {
    border-color: #ff0000;         
}



label:has(+ input[required])::after,
label:has(+ select[required])::after {
    content: ' *';     
    color: #ff0000;       
    font-weight: 1000;     
}



@media (max-width: 600px) { 
    body {
        padding: 1rem; 
    }

body > div {
        padding: 1.5rem;           
        border-radius: 16px;       
    }

    h1 {
        font-size: 1.5rem;         
    }

    fieldset {
        padding: 1rem;             
    }

    
    fieldset > div > div {
        flex-direction: column;    
        gap: 0.5rem;
    }

    
    form > div:last-child {
        flex-direction: column;
        align-items: center;
    }

    button {
        max-width: 100% !important; 
        width: 100%;
    }
}


:focus-visible {
    outline: 2px solid #4f46e5;   
    outline-offset: 2px;          
}





    


    </style>
</head>

<body>





<div> 
<h1>Inicio de Sesión </h1>
<p>Complete todos los campos </p>
<p>Campos marcados con * son obligatorios </p>



<form action="#" method="POST" id="registroForm">


<fieldset>
        <legend>Datos Personales</legend>


<div>
    <label for="nombre">Nombre *</label>
    <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan " required>
</div>


<div>
    <label for="Apellido">Apellido *</label>
    <input type="text" id="Apellido" name="Apellido" placeholder="Ej:  Pérez" required>
</div>

<div>
    <label for="DNI">DNI *</label>
    <input type="text" id="DNI" name="DNI" placeholder="Ej: 48503456 " required>
</div>

<div>
    <label for="Fecha de nacimiento">Fecha de nacimiento </label>
    <input type="date" id="Fecha de nacimiento" name="Fecha de nacimiento" placeholder="Ej: 18/5/96 " >
</div>

<div>
    <label for="Correo electrónico">Correo electrónico *</label>
    <input type="email" id="Correo electrónico" name="Correo electrónico" placeholder="Ej: xxxxxxx@gmail.com " required>
</div>

<div>
    <label for="Número de teléfono">Número de teléfono</label>
    <input type="tel" id="Número de teléfono" name="Número de teléfono" placeholder="Ej: +5491123455077 " required>
</div>

</fieldset>

<fieldset>
        <legend>Datos Extras</legend>



        
<div>
                    <label for="pais">País *</label>
                    <select id="pais" name="pais" required>
                        <option value="">Seleccione un pais </option>
                        <option value="AR">Argentina</option>
                        <option value="BR">Brazil</option>
                        <option value="US">Estados Unidos</option>
                        <option value="CO">Colombia</option>
                        <option value="UY">Uruguay</option>
                        <option value="PY">Paraguay</option>
                        <option value="PE">Peru</option>
                        
                    </select>
                </div>

                <div>
                    <label>Productos que te interesan</label>
                    <div>
                        <label>
                            <input type="radio" name="Productos que te interesan" value="Gorras">
                            Gorras
                        </label>
                        <label>
                            <input type="radio" name="Productos que te interesan" value="Remeras">
                            Remeras
                        </label>
                        <label>
                            <input type="radio" name="Productos que te interesan" value="Pantalones">
                            Pantalones
                        </label>
                        <label>
                            <input type="radio" name="Productos que te interesan" value="Shorts">
                            Shorts
                        </label>
                    </div>
                </div>

    
<div>
                    <label>Deporte que practicas</label>
                    <div>
                        <label>
                            <input type="checkbox" name="deportes" value="Fútbol">
                            Fútbol
                        </label>
                        <label>
                            <input type="checkbox" name="deportes" value="Baloncesto">
                            Baloncesto
                        </label>
                        <label>
                            <input type="checkbox" name="deportes" value="Tenis">
                            Tenis
                        </label>
                        <label>
                            <input type="checkbox" name="deportes" value="Otro">
                            Otro
                        </label>
                        
                    </div>
                </div>
<div>
                    <label for="comentarios">Comentarios</label>
                    <textarea id="comentarios" name="comentarios" rows="4" placeholder="Que te gustaria que agreguemos?"></textarea>
                </div>





</fieldset>


            <fieldset>
                <legend>Datos de Seguridad</legend>

                <div>
                    <label for="password">Contraseña *</label>
                    <input type="password" id="password" name="password" placeholder="Minimo de  8 caracteres" minlength="8" required>
                </div>

                <div>
                    <label for="confirmPassword">Confirmar contraseña *</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repita su contraseña" minlength="8" required>
                </div>

                <div>
                <label>
                    <input type="checkbox" name="terminos" required>
                    Acepto los <a href="#">términos y condiciones</a> *
                </label>
            </div>

            
            <div>
                <button type="submit"><a href="inicio.html">Enviar formulario</a></button>
                <button type="reset">Reiniciar formulario</button>
            </div>
        
        

            </fieldset>

</form>


</body>
</html>
